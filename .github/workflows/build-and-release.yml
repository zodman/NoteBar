name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Explicit version (overrides bump type, e.g. 1.2.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, Package & Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Next Version
        id: semver
        shell: pwsh
        run: |
          git fetch --tags --force
          $latestTag = git tag -l "v*" --sort=-v:refname | Select-Object -First 1
          Write-Host "Latest Git Tag found: '$latestTag'"

          $baseVersion = "1.1.0"
          $nextVersion = $baseVersion

          # 1. Custom version input from workflow_dispatch
          $customInput = "${{ inputs.custom_version }}".Trim()
          if ($customInput -ne "") {
              $nextVersion = $customInput -replace '^v', ''
              Write-Host "Using user-provided custom version: $nextVersion"
          }
          # 2. Triggered by a tag push (e.g. refs/tags/v1.2.3)
          elseif ($env:GITHUB_REF -match '^refs/tags/v?([0-9]+\.[0-9]+\.[0-9]+.*)$') {
              $nextVersion = $Matches[1]
              Write-Host "Using triggered git tag version: $nextVersion"
          }
          # 3. Increment from latest tag
          elseif ($latestTag -match '^v?([0-9]+)\.([0-9]+)\.([0-9]+)') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3]
              $bump = "${{ inputs.bump_type }}"
              if (-not $bump) { $bump = "patch" }

              switch ($bump) {
                  "major" { $major++; $minor = 0; $patch = 0 }
                  "minor" { $minor++; $patch = 0 }
                  default { $patch++ }
              }
              $nextVersion = "$major.$minor.$patch"
              Write-Host "Incremented ($bump) from $latestTag to $nextVersion"
          }
          # 4. First release fallback
          else {
              $nextVersion = $baseVersion
              Write-Host "No prior tags found. Using initial version: $nextVersion"
          }

          $tag = "v$nextVersion"
          Write-Host "Computed Version: $nextVersion (Tag: $tag)"
          "VERSION=$nextVersion" >> $env:GITHUB_OUTPUT
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src/NoteBar.sln

      - name: Build solution
        run: |
          dotnet build src/NoteBar.sln -c Release --no-restore -p:Version=${{ steps.semver.outputs.VERSION }} -p:AssemblyVersion=${{ steps.semver.outputs.VERSION }} -p:FileVersion=${{ steps.semver.outputs.VERSION }}

      - name: Publish NoteBar Executables
        run: |
          dotnet publish src/NoteBar.App/NoteBar.App.csproj -c Release -p:Version=${{ steps.semver.outputs.VERSION }} -o ./publish
          dotnet publish src/NoteBar.Wpf/NoteBar.Wpf.csproj -c Release -p:Version=${{ steps.semver.outputs.VERSION }} -o ./publish

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./NoteBar-windows-x64.zip

      - name: Build Chocolatey Package
        run: |
          New-Item -ItemType Directory -Path chocolatey/tools/src -Force
          Copy-Item -Path ./publish/* -Destination chocolatey/tools/src -Recurse -Force
          New-Item -ItemType Directory -Path ./chocolatey-package -Force
          choco pack chocolatey/notebar.nuspec --version ${{ steps.semver.outputs.VERSION }} --outputdirectory ./chocolatey-package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebar-${{ steps.semver.outputs.VERSION }}
          path: |
            ./NoteBar-windows-x64.zip
            ./chocolatey-package/*.nupkg

      - name: Generate Release Notes
        shell: pwsh
        run: |
          $ver = "${{ steps.semver.outputs.VERSION }}"
          $tag = "${{ steps.semver.outputs.TAG }}"
          $bt3 = [string][char]96 * 3
          $bt1 = [string][char]96
          $lines = @(
            "## NoteBar $tag",
            "",
            "Windows 11 status indicator clone of AnyBar (.NET 8). Supports floating pill widget and system tray NotifyIcon, controllable via UDP (${bt1}0.0.0.0:1738${bt1}) and CLI.",
            "",
            "---",
            "",
            "### Command-Line Installation",
            "",
            "#### Option 1: Chocolatey (Recommended)",
            "Run in **PowerShell as Administrator**:",
            "",
            "${bt3}powershell",
            "# Automatically download and install with auto-start enabled:",
            "`$pkg = (irm `"https://api.github.com/repos/zodman/NoteBar/releases/latest`").assets | ? { `$_.name -like `"*.nupkg`" } | select -exp browser_download_url -first 1; irm `$pkg -OutFile `"`$env:TEMP\notebar.nupkg`"; choco install notebar --source=`"'`$env:TEMP'`" --params `"'/[AutoStart]'`" -y",
            "${bt3}",
            "",
            "Or install this specific version directly:",
            "${bt3}powershell",
            "Invoke-WebRequest -Uri `"https://github.com/zodman/NoteBar/releases/download/$tag/notebar.$ver.nupkg`" -OutFile `"`$env:TEMP\notebar.$ver.nupkg`"",
            "choco install notebar --source=`"'`$env:TEMP'`" --params `"'/[AutoStart]'`" -y",
            "${bt3}",
            "",
            "#### Option 2: Portable ZIP (PowerShell)",
            "${bt3}powershell",
            "Invoke-WebRequest -Uri `"https://github.com/zodman/NoteBar/releases/download/$tag/NoteBar-windows-x64.zip`" -OutFile `"`$env:TEMP\NoteBar-windows-x64.zip`"",
            "Expand-Archive -Path `"`$env:TEMP\NoteBar-windows-x64.zip`" -DestinationPath `"C:\Tools\NoteBar`" -Force",
            "& `"C:\Tools\NoteBar\notebar.exe`"",
            "${bt3}",
            "",
            "---",
            "",
            "### Quick Usage",
            "${bt3}powershell",
            "# Start NoteBar",
            "notebar",
            "",
            "# Change indicator color via UDP:",
            "echo -n `"green`" | ncat -4u -w1 127.0.0.1 1738",
            "echo -n `"red`" | ncat -4u -w1 127.0.0.1 1738",
            "${bt3}"
          )
          $content = ($lines -join "`n") -replace '/\[AutoStart\]', '/AutoStart'
          [System.IO.File]::WriteAllText("release_notes.md", $content, [System.Text.Encoding]::UTF8)

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.TAG }}
          name: NoteBar ${{ steps.semver.outputs.TAG }}
          body_path: release_notes.md
          files: |
            ./NoteBar-windows-x64.zip
            ./chocolatey-package/*.nupkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
